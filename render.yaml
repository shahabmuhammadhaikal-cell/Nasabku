services:
  - type: web
    name: nasabku
    runtime: node
    plan: free
    # --include=dev wajib: NODE_ENV=production membuat npm melewatkan devDependencies,
    # sehingga tsc tidak terpasang dan build gagal dalam hitungan detik.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HARI
        value: "30"
      - key: FIREBASE_PROJECT_ID
        value: nasabku-prod
      # Isi lewat dashboard Render (Environment → Secret). Jangan commit nilainya.
      # Tanpa secret ini aplikasi tetap hidup, tetapi rute data menjawab 503
      # FIRESTORE_BELUM_DIKONFIGURASI.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
