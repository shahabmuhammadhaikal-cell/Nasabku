services:
  - type: web
    name: nasabku
    runtime: node
    plan: free
    # --include=dev wajib: NODE_ENV=production membuat npm melewatkan devDependencies,
    # sehingga tsc tidak terpasang dan build gagal dalam hitungan detik.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HARI
        value: "30"
      # Tanpa Persistent Disk, data SQLite kembali kosong setiap deploy.
      # Untuk data permanen: pasang disk di Render, lalu setel DATABASE_PATH ke /var/data/nasabku.db
      # (jangan setel sebelum disk ada — direktori itu belum bisa ditulis).
